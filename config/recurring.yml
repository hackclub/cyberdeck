production:
  # Checks that each participant's repository and Codespace still exist, so the
  # app never points them at something that was deleted.
  verify_provisionings:
    class: VerifyProvisioningsJob
    schedule: every hour at minute 7

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
